#-------------------------------------------#
#   niyamaka.com — gobj-ui test-app (mobile testing demo)
#
#   Static bundle only: the test-app is a pure gobj tree with hash
#   routing and no backend. Content is pushed by
#   kernel/js/gobj-ui/test-app/deploy-niyamaka.sh, which rsyncs its
#   ./dist/ to /yuneta/gui/niyamaka.com.
#
#   Lives here rather than beside that script because the script is a
#   local-only helper (git-excluded, never committed) — a config kept
#   next to it would not survive a fresh clone.
#-------------------------------------------#
server {
    listen 80;
    listen [::]:80;
    server_name niyamaka.com;

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2 on;

    server_name niyamaka.com;
    root        /yuneta/gui/niyamaka.com;

    ssl_certificate "/etc/letsencrypt/live/niyamaka.com/fullchain.pem";
    ssl_certificate_key "/etc/letsencrypt/live/niyamaka.com/privkey.pem";

    index index.html;

    location / {
        try_files $uri $uri/index.html $uri/ =404;
    }

    # index.html references hashed bundles — revalidate every request
    # so a redeploy is picked up immediately (cheap 304 when unchanged).
    location = /index.html {
        expires -1;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
