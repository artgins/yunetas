<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 598" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.28.5 against 7.28.4: change of the time one operation takes">
<title>Yuneta 7.28.5 against 7.28.4: change of the time one operation takes</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="597" rx="10"/>
<text class="t" x="20" y="30">Yuneta 7.28.5 against 7.28.4: change of the time one operation takes</text>
<text class="m" x="20" y="48">left of zero is faster &#183; blue faster, grey within noise, red a price paid on purpose &#183; whisker &#177;1 sd &#183; bars past +40% are cut (factor on the right)</text>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="566"/>
<text class="m" x="330.0" y="582" text-anchor="middle">-100%</text>
<line class="grid" x1="408.6" x2="408.6" y1="66" y2="566"/>
<text class="m" x="408.6" y="582" text-anchor="middle">-75%</text>
<line class="grid" x1="487.1" x2="487.1" y1="66" y2="566"/>
<text class="m" x="487.1" y="582" text-anchor="middle">-50%</text>
<line class="grid" x1="565.7" x2="565.7" y1="66" y2="566"/>
