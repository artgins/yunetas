<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 848" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.25.5 against 7.25.4: change of the time one operation takes">
<title>Yuneta 7.25.5 against 7.25.4: change of the time one operation takes</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
