<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 362" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.29.0: operations per second on one core">
<title>Yuneta 7.29.0: operations per second on one core</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="361" rx="10"/>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="326"/>
<text class="m" x="330.0" y="342" text-anchor="middle">0</text>
<line class="grid" x1="369.0" x2="369.0" y1="66" y2="326"/>
<text class="m" x="369.0" y="342" text-anchor="middle">50k</text>
<line class="grid" x1="408.1" x2="408.1" y1="66" y2="326"/>
<text class="m" x="408.1" y="342" text-anchor="middle">100k</text>
<line class="grid" x1="447.1" x2="447.1" y1="66" y2="326"/>
<text class="m" x="447.1" y="342" text-anchor="middle">150k</text>
<line class="grid" x1="486.1" x2="486.1" y1="66" y2="326"/>
<text class="m" x="486.1" y="342" text-anchor="middle">200k</text>
<line class="grid" x1="525.2" x2="525.2" y1="66" y2="326"/>
<text class="m" x="525.2" y="342" text-anchor="middle">250k</text>
<line class="grid" x1="564.2" x2="564.2" y1="66" y2="326"/>
<text class="m" x="564.2" y="342" text-anchor="middle">300k</text>
<line class="grid" x1="603.3" x2="603.3" y1="66" y2="326"/>
<text class="m" x="603.3" y="342" text-anchor="middle">350k</text>
<line class="grid" x1="642.3" x2="642.3" y1="66" y2="326"/>
<text class="m" x="642.3" y="342" text-anchor="middle">400k</text>
<line class="grid" x1="681.3" x2="681.3" y1="66" y2="326"/>
<text class="m" x="681.3" y="342" text-anchor="middle">450k</text>
<line class="grid" x1="720.4" x2="720.4" y1="66" y2="326"/>
<text class="m" x="720.4" y="342" text-anchor="middle">500k</text>
<line class="grid" x1="759.4" x2="759.4" y1="66" y2="326"/>
<text class="m" x="759.4" y="342" text-anchor="middle">550k</text>
<line class="grid" x1="798.4" x2="798.4" y1="66" y2="326"/>
<text class="m" x="798.4" y="342" text-anchor="middle">600k</text>
<text class="t" x="20" y="30">Yuneta 7.29.0: operations per second on one core</text>
<text class="m" x="20" y="48">as each benchmark counts them: a record stored or read, a message echoed, a round trip, a login</text>
<text class="l" x="20" y="82">timeranger2 appends (records stored)</text>
<rect class="cur" x="330" y="72" width="336.4" height="12" rx="3"/>
<text class="v" x="672.4" y="82">431 K/s</text>
<text class="l" x="20" y="108">appends with a live reader</text>
<rect class="cur" x="330" y="98" width="276.7" height="12" rx="3"/>
<text class="v" x="612.7" y="108">354 K/s</text>
<text class="l" x="20" y="134">timeranger2 reads (records loaded)</text>
<rect class="cur" x="330" y="124" width="447.6" height="12" rx="3"/>
<text class="v" x="783.6" y="134">573 K/s</text>
<text class="l" x="20" y="160">reads, page by page</text>
<rect class="cur" x="330" y="150" width="319.8" height="12" rx="3"/>
<text class="v" x="655.8" y="160">410 K/s</text>
<text class="l" x="20" y="186">full gobj stack, TCP</text>
<rect class="cur" x="330" y="176" width="48.2" height="12" rx="3"/>
<text class="v" x="384.2" y="186">61.8 K/s</text>
<text class="l" x="20" y="212">gobj stack, TCP + append</text>
<rect class="cur" x="330" y="202" width="37.2" height="12" rx="3"/>
<text class="v" x="373.2" y="212">47.6 K/s</text>
<text class="l" x="20" y="238">gobj stack, TLS (OpenSSL)</text>
<rect class="cur" x="330" y="228" width="35.4" height="12" rx="3"/>
<text class="v" x="371.4" y="238">45.3 K/s</text>
<text class="l" x="20" y="264">gobj stack, TLS + append</text>
<rect class="cur" x="330" y="254" width="28.4" height="12" rx="3"/>
<text class="v" x="364.4" y="264">36.4 K/s</text>
<text class="l" x="20" y="290">OAuth2 BFF logins (HTTP, 5 clients)</text>
<rect class="cur" x="330" y="280" width="10.1" height="12" rx="3"/>
<text class="v" x="346.1" y="290">12.9 K/s</text>
<text class="l" x="20" y="316">inter-yuno events (websocket round trip)</text>
<rect class="cur" x="330" y="306" width="21.9" height="12" rx="3"/>
<text class="v" x="357.9" y="316">28.0 K/s</text>
</svg>
