<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.31.0: operations per second on one core">
<title>Yuneta 7.31.0: operations per second on one core</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="439" rx="10"/>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="404"/>
<text class="m" x="330.0" y="420" text-anchor="middle">0</text>
<line class="grid" x1="372.1" x2="372.1" y1="66" y2="404"/>
<text class="m" x="372.1" y="420" text-anchor="middle">50k</text>
<line class="grid" x1="414.3" x2="414.3" y1="66" y2="404"/>
<text class="m" x="414.3" y="420" text-anchor="middle">100k</text>
<line class="grid" x1="456.4" x2="456.4" y1="66" y2="404"/>
<text class="m" x="456.4" y="420" text-anchor="middle">150k</text>
<line class="grid" x1="498.5" x2="498.5" y1="66" y2="404"/>
<text class="m" x="498.5" y="420" text-anchor="middle">200k</text>
<line class="grid" x1="540.7" x2="540.7" y1="66" y2="404"/>
<text class="m" x="540.7" y="420" text-anchor="middle">250k</text>
<line class="grid" x1="582.8" x2="582.8" y1="66" y2="404"/>
<text class="m" x="582.8" y="420" text-anchor="middle">300k</text>
<line class="grid" x1="624.9" x2="624.9" y1="66" y2="404"/>
<text class="m" x="624.9" y="420" text-anchor="middle">350k</text>
<line class="grid" x1="667.1" x2="667.1" y1="66" y2="404"/>
<text class="m" x="667.1" y="420" text-anchor="middle">400k</text>
<line class="grid" x1="709.2" x2="709.2" y1="66" y2="404"/>
<text class="m" x="709.2" y="420" text-anchor="middle">450k</text>
<line class="grid" x1="751.3" x2="751.3" y1="66" y2="404"/>
<text class="m" x="751.3" y="420" text-anchor="middle">500k</text>
<line class="grid" x1="793.5" x2="793.5" y1="66" y2="404"/>
<text class="m" x="793.5" y="420" text-anchor="middle">550k</text>
<text class="t" x="20" y="30">Yuneta 7.31.0: operations per second on one core</text>
<text class="m" x="20" y="48">as each benchmark counts them: a record stored or read, a message echoed, a round trip, a login</text>
<text class="l" x="20" y="82">timeranger2 appends (records stored)</text>
<rect class="cur" x="330" y="72" width="347.1" height="12" rx="3"/>
<text class="v" x="683.1" y="82">412 K/s</text>
<text class="l" x="20" y="108">appends with a live reader</text>
<rect class="cur" x="330" y="98" width="281.0" height="12" rx="3"/>
<text class="v" x="617.0" y="108">333 K/s</text>
<text class="l" x="20" y="134">timeranger2 reads (records loaded)</text>
<rect class="cur" x="330" y="124" width="447.6" height="12" rx="3"/>
<text class="v" x="783.6" y="134">531 K/s</text>
<text class="l" x="20" y="160">reads, page by page</text>
<rect class="cur" x="330" y="150" width="333.3" height="12" rx="3"/>
<text class="v" x="669.3" y="160">396 K/s</text>
<text class="l" x="20" y="186">io_uring event loop alone (1 KB echo)</text>
<rect class="cur" x="330" y="176" width="119.6" height="12" rx="3"/>
<text class="v" x="455.6" y="186">142 K/s</text>
<text class="l" x="20" y="212">event loop + timeranger2 append</text>
<rect class="cur" x="330" y="202" width="79.6" height="12" rx="3"/>
<text class="v" x="415.6" y="212">94.5 K/s</text>
<text class="l" x="20" y="238">full gobj stack, TCP</text>
<rect class="cur" x="330" y="228" width="51.7" height="12" rx="3"/>
<text class="v" x="387.7" y="238">61.4 K/s</text>
<text class="l" x="20" y="264">gobj stack, TCP + append</text>
<rect class="cur" x="330" y="254" width="38.9" height="12" rx="3"/>
<text class="v" x="374.9" y="264">46.2 K/s</text>
<text class="l" x="20" y="290">gobj stack, TLS (OpenSSL)</text>
<rect class="cur" x="330" y="280" width="37.7" height="12" rx="3"/>
<text class="v" x="373.7" y="290">44.7 K/s</text>
<text class="l" x="20" y="316">gobj stack, TLS + append</text>
<rect class="cur" x="330" y="306" width="29.9" height="12" rx="3"/>
<text class="v" x="365.9" y="316">35.5 K/s</text>
<text class="l" x="20" y="342">OAuth2 BFF logins (HTTP, 5 clients)</text>
<rect class="cur" x="330" y="332" width="9.9" height="12" rx="3"/>
<text class="v" x="345.9" y="342">11.8 K/s</text>
<text class="l" x="20" y="368">inter-yuno events (websocket round trip)</text>
<rect class="cur" x="330" y="358" width="22.7" height="12" rx="3"/>
<text class="v" x="358.7" y="368">27.0 K/s</text>
<text class="l" x="20" y="394">MQTT QoS 0 through the broker</text>
<rect class="cur" x="330" y="384" width="29.4" height="12" rx="3"/>
<text class="v" x="365.4" y="394">34.8 K/s</text>
</svg>
