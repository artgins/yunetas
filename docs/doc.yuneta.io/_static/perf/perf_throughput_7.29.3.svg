<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.29.3: operations per second on one core">
<title>Yuneta 7.29.3: operations per second on one core</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="439" rx="10"/>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="404"/>
<text class="m" x="330.0" y="420" text-anchor="middle">0</text>
<line class="grid" x1="369.3" x2="369.3" y1="66" y2="404"/>
<text class="m" x="369.3" y="420" text-anchor="middle">50k</text>
<line class="grid" x1="408.5" x2="408.5" y1="66" y2="404"/>
<text class="m" x="408.5" y="420" text-anchor="middle">100k</text>
<line class="grid" x1="447.8" x2="447.8" y1="66" y2="404"/>
<text class="m" x="447.8" y="420" text-anchor="middle">150k</text>
<line class="grid" x1="487.1" x2="487.1" y1="66" y2="404"/>
<text class="m" x="487.1" y="420" text-anchor="middle">200k</text>
<line class="grid" x1="526.3" x2="526.3" y1="66" y2="404"/>
<text class="m" x="526.3" y="420" text-anchor="middle">250k</text>
<line class="grid" x1="565.6" x2="565.6" y1="66" y2="404"/>
<text class="m" x="565.6" y="420" text-anchor="middle">300k</text>
<line class="grid" x1="604.9" x2="604.9" y1="66" y2="404"/>
<text class="m" x="604.9" y="420" text-anchor="middle">350k</text>
<line class="grid" x1="644.2" x2="644.2" y1="66" y2="404"/>
<text class="m" x="644.2" y="420" text-anchor="middle">400k</text>
<line class="grid" x1="683.4" x2="683.4" y1="66" y2="404"/>
<text class="m" x="683.4" y="420" text-anchor="middle">450k</text>
<line class="grid" x1="722.7" x2="722.7" y1="66" y2="404"/>
<text class="m" x="722.7" y="420" text-anchor="middle">500k</text>
<line class="grid" x1="762.0" x2="762.0" y1="66" y2="404"/>
<text class="m" x="762.0" y="420" text-anchor="middle">550k</text>
<text class="t" x="20" y="30">Yuneta 7.29.3: operations per second on one core</text>
<text class="m" x="20" y="48">as each benchmark counts them: a record stored or read, a message echoed, a round trip, a login</text>
<text class="l" x="20" y="82">timeranger2 appends (records stored)</text>
<rect class="cur" x="330" y="72" width="329.3" height="12" rx="3"/>
<text class="v" x="665.3" y="82">419 K/s</text>
<text class="l" x="20" y="108">appends with a live reader</text>
<rect class="cur" x="330" y="98" width="266.4" height="12" rx="3"/>
<text class="v" x="602.4" y="108">339 K/s</text>
<text class="l" x="20" y="134">timeranger2 reads (records loaded)</text>
<rect class="cur" x="330" y="124" width="447.6" height="12" rx="3"/>
<text class="v" x="783.6" y="134">570 K/s</text>
<text class="l" x="20" y="160">reads, page by page</text>
<rect class="cur" x="330" y="150" width="321.5" height="12" rx="3"/>
<text class="v" x="657.5" y="160">409 K/s</text>
<text class="l" x="20" y="186">io_uring event loop alone (1 KB echo)</text>
<rect class="cur" x="330" y="176" width="115.8" height="12" rx="3"/>
<text class="v" x="451.8" y="186">147 K/s</text>
<text class="l" x="20" y="212">event loop + timeranger2 append</text>
<rect class="cur" x="330" y="202" width="76.5" height="12" rx="3"/>
<text class="v" x="412.5" y="212">97.4 K/s</text>
<text class="l" x="20" y="238">full gobj stack, TCP</text>
<rect class="cur" x="330" y="228" width="48.5" height="12" rx="3"/>
<text class="v" x="384.5" y="238">61.7 K/s</text>
<text class="l" x="20" y="264">gobj stack, TCP + append</text>
<rect class="cur" x="330" y="254" width="36.9" height="12" rx="3"/>
<text class="v" x="372.9" y="264">47.0 K/s</text>
<text class="l" x="20" y="290">gobj stack, TLS (OpenSSL)</text>
<rect class="cur" x="330" y="280" width="35.4" height="12" rx="3"/>
<text class="v" x="371.4" y="290">45.0 K/s</text>
<text class="l" x="20" y="316">gobj stack, TLS + append</text>
<rect class="cur" x="330" y="306" width="28.6" height="12" rx="3"/>
<text class="v" x="364.6" y="316">36.4 K/s</text>
<text class="l" x="20" y="342">OAuth2 BFF logins (HTTP, 5 clients)</text>
<rect class="cur" x="330" y="332" width="10.3" height="12" rx="3"/>
<text class="v" x="346.3" y="342">13.1 K/s</text>
<text class="l" x="20" y="368">inter-yuno events (websocket round trip)</text>
<rect class="cur" x="330" y="358" width="22.4" height="12" rx="3"/>
<text class="v" x="358.4" y="368">28.5 K/s</text>
<text class="l" x="20" y="394">MQTT QoS 0 through the broker</text>
<rect class="cur" x="330" y="384" width="28.5" height="12" rx="3"/>
<text class="v" x="364.5" y="394">36.3 K/s</text>
</svg>
