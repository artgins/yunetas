<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 830" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta performance, release after release">
<title>Yuneta performance, release after release</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="829" rx="10"/>
<text class="t" x="20" y="30">Yuneta performance, release after release</text>
<text class="m" x="20" y="48">one panel per figure, each on its own scale from zero &#183; the A/B figures of each release report (7.25.4 is the baseline of 7.25.5)</text>
<text class="l" x="20" y="80">Appends per second</text>
<line class="grid" x1="30" x2="430" y1="176" y2="176"/>
<polyline class="curl" points="30.0,106.9 380.0,106.4"/>
<circle class="prev" cx="30.0" cy="106.9" r="4.5" stroke-width="2"><title>7.25.4: 220,120</title></circle>
<text class="v" x="38.0" y="98.9" text-anchor="start">220,120</text>
<text class="m" x="30.0" y="192" text-anchor="middle">7.25.4</text>
<circle class="cur" cx="380.0" cy="106.4" r="4.5" stroke-width="2"><title>7.25.5: 221,588</title></circle>
<text class="v" x="388.0" y="110.4" text-anchor="start">221,588</text>
<text class="m" x="380.0" y="192" text-anchor="middle">7.25.5</text>
<text class="l" x="450" y="80">Open a store as master (ms)</text>
<line class="grid" x1="460" x2="860" y1="176" y2="176"/>
