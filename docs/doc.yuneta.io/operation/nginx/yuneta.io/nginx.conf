#
#   Root nginx configuration for the node that serves the Yuneta domains
#   (37.187.89.46 — aliases: yuneta.io / app.wattyzer.com /
#   demo.estadodelaire.com / deploycenter).
#
#   This file owns ONLY:
#     - the global http {} settings (TLS, gzip, security headers),
#     - the port-80 default_server that drops unknown hosts,
#     - the Yuneta-owned domains (yuneta.io, doc.yuneta.io, yunetas.com,
#       yuneta.es, yuneta.com),
#     - the `include conf.d/*.conf` hook.
#
#   Every other product serving a domain on this node ships its own
#   drop-in into conf.d/ and never edits this file:
#     - niyamaka.com          -> ./conf.d/niyamaka.com.conf (deployed here)
#     - app.wattyzer.com      -> wattyzer/operation/tasks/nginx/app.wattyzer.com/
#     - demo.estadodelaire.com-> estadodelaire/operation/tasks/nginx/demo.estadodelaire.com/
#
#   The server is plain nginx at /yuneta/bin/nginx (NOT openresty — this node
#   needs no Lua auth, unlike artgins). Deploy with ./deploy-conf.sh.
#
#   WARNING: reinstalling nginx overwrites conf/nginx.conf with the stock
#   default and silently drops every server block. The running master keeps
#   the old config in memory, so nothing breaks until the next restart — then
#   every HTTPS host goes down at once. This repo is the only backup; after
#   any nginx upgrade, re-run ./deploy-conf.sh.
#
user yuneta;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include             mime.types;
    default_type        application/octet-stream;
    server_tokens       off;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    resolver            1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout    5s;

    # Set access_log to off
    #access_log          off;

    # gzip (type-restricted to limit BREACH exposure)
    # comp_level 6 matches vite's reported gzip size; default (1) leaves
    # ~15-20% on the table.  gzip_static serves pre-compressed *.gz next
    # to the asset when the build emits them (vite-plugin-compression).
    gzip                on;
    gzip_static         on;
    gzip_vary           on;
    gzip_comp_level     6;
    gzip_min_length     1024;
    gzip_proxied        off;
    gzip_types          text/plain text/css application/javascript application/json image/svg+xml;

    # TLS hardening (applies to all servers)
    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers             ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache       shared:SSL:10m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # Security headers (use `always` so they apply to error responses too)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Permissions-Policy        "geolocation=(self), microphone=(), camera=()" always;

    #--------------------------#
    #   Unknown hosts
    #--------------------------#
    # Anything not claimed by a server_name here or in conf.d/ is dropped
    # without a response. Keep this the only port-80 default_server.
    server {
        listen      80 default_server;
        listen      [::]:80 default_server;
        server_name _;
        return 444;
    }

    #--------------------------#
    #   http -> https
    #--------------------------#
    # Only the Yuneta-owned hosts; every conf.d drop-in carries its own.
    server {
        listen 80;
        listen [::]:80;
        server_name yuneta.io doc.yuneta.io
                    yunetas.com yuneta.es yuneta.com;

        return 301 https://$host$request_uri;
    }

    #-------------------------------------------#
    #   yuneta.io
    #-------------------------------------------#
    server {
        listen      443 ssl default_server;
        listen      [::]:443 ssl default_server;
        http2 on;

        server_name yuneta.io;
        root        /yuneta/gui/doc.yuneta.io;

        ssl_certificate "/etc/letsencrypt/live/yuneta.io/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/yuneta.io/privkey.pem";

        index index.html;

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        # index.html references hashed bundles — revalidate every request
        # so a redeploy is picked up immediately (cheap 304 when unchanged).
        location = /index.html {
            expires -1;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    #-------------------------------------------#
    #   doc.yuneta.io
    #-------------------------------------------#
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2 on;

        server_name doc.yuneta.io;
        root        /yuneta/gui/doc.yuneta.io;

        ssl_certificate "/etc/letsencrypt/live/doc.yuneta.io/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/doc.yuneta.io/privkey.pem";

        index index.html;

        # try_files must list $uri/index.html BEFORE $uri/: with the bare
        # $uri/ form nginx 301-redirects /page -> /page/, and that extra hop
        # breaks cross-page #anchor scrolling (browsers cache the 301, so the
        # symptom survives the fix until you clear cache).
        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        # index.html references hashed bundles — revalidate every request
        # so a redeploy is picked up immediately (cheap 304 when unchanged).
        location = /index.html {
            expires -1;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    #-------------------------------------------#
    #   yunetas.com
    #-------------------------------------------#
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2 on;

        server_name yunetas.com;
        root        /yuneta/gui/doc.yuneta.io;

        ssl_certificate "/etc/letsencrypt/live/yunetas.com/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/yunetas.com/privkey.pem";

        index index.html;

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        # index.html references hashed bundles — revalidate every request
        # so a redeploy is picked up immediately (cheap 304 when unchanged).
        location = /index.html {
            expires -1;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    #-------------------------------------------#
    #   yuneta.es
    #-------------------------------------------#
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2 on;

        server_name yuneta.es;
        root        /yuneta/gui/doc.yuneta.io;

        ssl_certificate "/etc/letsencrypt/live/yuneta.es/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/yuneta.es/privkey.pem";

        index index.html;

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        # index.html references hashed bundles — revalidate every request
        # so a redeploy is picked up immediately (cheap 304 when unchanged).
        location = /index.html {
            expires -1;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    #-------------------------------------------#
    #   yuneta.com
    #-------------------------------------------#
    server {
        listen      443 ssl;
        listen      [::]:443 ssl;
        http2 on;

        server_name yuneta.com;
        root        /yuneta/gui/doc.yuneta.io;

        ssl_certificate "/etc/letsencrypt/live/yuneta.com/fullchain.pem";
        ssl_certificate_key "/etc/letsencrypt/live/yuneta.com/privkey.pem";

        index index.html;

        location / {
            try_files $uri $uri/index.html $uri/ =404;
        }

        # index.html references hashed bundles — revalidate every request
        # so a redeploy is picked up immediately (cheap 304 when unchanged).
        location = /index.html {
            expires -1;
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }

    #-------------------------------------------#
    #   Per-product server blocks.
    #   Each app owning a domain on this node drops its own .conf into
    #   /yuneta/bin/nginx/conf/conf.d/ — see ./conf.d/ here, plus
    #   wattyzer/operation/tasks/nginx/app.wattyzer.com/ and
    #   estadodelaire/operation/tasks/nginx/demo.estadodelaire.com/.
    #-------------------------------------------#
    include conf.d/*.conf;
}
