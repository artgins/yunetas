<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 388" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.26.0: operations per second on one core">
<title>Yuneta 7.26.0: operations per second on one core</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="387" rx="10"/>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="352"/>
<text class="m" x="330.0" y="368" text-anchor="middle">0</text>
<line class="grid" x1="430.0" x2="430.0" y1="66" y2="352"/>
<text class="m" x="430.0" y="368" text-anchor="middle">50k</text>
<line class="grid" x1="530.0" x2="530.0" y1="66" y2="352"/>
<text class="m" x="530.0" y="368" text-anchor="middle">100k</text>
<line class="grid" x1="629.9" x2="629.9" y1="66" y2="352"/>
<text class="m" x="629.9" y="368" text-anchor="middle">150k</text>
<line class="grid" x1="729.9" x2="729.9" y1="66" y2="352"/>
<text class="m" x="729.9" y="368" text-anchor="middle">200k</text>
<text class="t" x="20" y="30">Yuneta 7.26.0: operations per second on one core</text>
<text class="m" x="20" y="48">as each benchmark counts them: a record stored or read, a message echoed, a round trip, a login</text>
<text class="l" x="20" y="82">timeranger2 appends (records stored)</text>
<rect class="cur" x="330" y="72" width="447.6" height="12" rx="3"/>
<text class="v" x="783.6" y="82">224 K/s</text>
<text class="l" x="20" y="108">appends with a live reader</text>
<rect class="cur" x="330" y="98" width="379.0" height="12" rx="3"/>
<text class="v" x="715.0" y="108">190 K/s</text>
<text class="l" x="20" y="134">timeranger2 reads (records loaded)</text>
<rect class="cur" x="330" y="124" width="430.2" height="12" rx="3"/>
<text class="v" x="766.2" y="134">215 K/s</text>
<text class="l" x="20" y="160">reads, page by page</text>
<rect class="cur" x="330" y="150" width="385.3" height="12" rx="3"/>
<text class="v" x="721.3" y="160">193 K/s</text>
<text class="l" x="20" y="186">io_uring event loop alone (1 KB echo)</text>
<rect class="cur" x="330" y="176" width="298.0" height="12" rx="3"/>
<text class="v" x="634.0" y="186">149 K/s</text>
<text class="l" x="20" y="212">event loop + timeranger2 append</text>
<rect class="cur" x="330" y="202" width="172.1" height="12" rx="3"/>
<text class="v" x="508.1" y="212">86.1 K/s</text>
<text class="l" x="20" y="238">full gobj stack, TCP</text>
<rect class="cur" x="330" y="228" width="79.0" height="12" rx="3"/>
<text class="v" x="415.0" y="238">39.5 K/s</text>
<text class="l" x="20" y="264">gobj stack, TCP + append</text>
<rect class="cur" x="330" y="254" width="60.7" height="12" rx="3"/>
<text class="v" x="396.7" y="264">30.4 K/s</text>
<text class="l" x="20" y="290">gobj stack, TLS (OpenSSL)</text>
<rect class="cur" x="330" y="280" width="59.5" height="12" rx="3"/>
<text class="v" x="395.5" y="290">29.8 K/s</text>
<text class="l" x="20" y="316">gobj stack, TLS + append</text>
<rect class="cur" x="330" y="306" width="47.8" height="12" rx="3"/>
<text class="v" x="383.8" y="316">23.9 K/s</text>
<text class="l" x="20" y="342">OAuth2 BFF logins (HTTP, 5 clients)</text>
<rect class="cur" x="330" y="332" width="17.2" height="12" rx="3"/>
<text class="v" x="353.2" y="342">8.6 K/s</text>
</svg>
