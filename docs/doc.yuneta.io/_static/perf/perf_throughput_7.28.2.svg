<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.28.2: operations per second on one core">
<title>Yuneta 7.28.2: operations per second on one core</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="439" rx="10"/>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="404"/>
<text class="m" x="330.0" y="420" text-anchor="middle">0</text>
<line class="grid" x1="369.7" x2="369.7" y1="66" y2="404"/>
<text class="m" x="369.7" y="420" text-anchor="middle">50k</text>
<line class="grid" x1="409.3" x2="409.3" y1="66" y2="404"/>
<text class="m" x="409.3" y="420" text-anchor="middle">100k</text>
<line class="grid" x1="449.0" x2="449.0" y1="66" y2="404"/>
<text class="m" x="449.0" y="420" text-anchor="middle">150k</text>
<line class="grid" x1="488.7" x2="488.7" y1="66" y2="404"/>
<text class="m" x="488.7" y="420" text-anchor="middle">200k</text>
<line class="grid" x1="528.4" x2="528.4" y1="66" y2="404"/>
<text class="m" x="528.4" y="420" text-anchor="middle">250k</text>
<line class="grid" x1="568.0" x2="568.0" y1="66" y2="404"/>
<text class="m" x="568.0" y="420" text-anchor="middle">300k</text>
<line class="grid" x1="607.7" x2="607.7" y1="66" y2="404"/>
<text class="m" x="607.7" y="420" text-anchor="middle">350k</text>
<line class="grid" x1="647.4" x2="647.4" y1="66" y2="404"/>
<text class="m" x="647.4" y="420" text-anchor="middle">400k</text>
<line class="grid" x1="687.1" x2="687.1" y1="66" y2="404"/>
<text class="m" x="687.1" y="420" text-anchor="middle">450k</text>
<line class="grid" x1="726.7" x2="726.7" y1="66" y2="404"/>
<text class="m" x="726.7" y="420" text-anchor="middle">500k</text>
<line class="grid" x1="766.4" x2="766.4" y1="66" y2="404"/>
<text class="m" x="766.4" y="420" text-anchor="middle">550k</text>
<text class="t" x="20" y="30">Yuneta 7.28.2: operations per second on one core</text>
<text class="m" x="20" y="48">as each benchmark counts them: a record stored or read, a message echoed, a round trip, a login</text>
<text class="l" x="20" y="82">timeranger2 appends (records stored)</text>
<rect class="cur" x="330" y="72" width="344.7" height="12" rx="3"/>
<text class="v" x="680.7" y="82">434 K/s</text>
<text class="l" x="20" y="108">appends with a live reader</text>
<rect class="cur" x="330" y="98" width="277.3" height="12" rx="3"/>
<text class="v" x="613.3" y="108">349 K/s</text>
<text class="l" x="20" y="134">timeranger2 reads (records loaded)</text>
<rect class="cur" x="330" y="124" width="447.6" height="12" rx="3"/>
<text class="v" x="783.6" y="134">564 K/s</text>
<text class="l" x="20" y="160">reads, page by page</text>
<rect class="cur" x="330" y="150" width="330.6" height="12" rx="3"/>
<text class="v" x="666.6" y="160">417 K/s</text>
<text class="l" x="20" y="186">io_uring event loop alone (1 KB echo)</text>
<rect class="cur" x="330" y="176" width="117.1" height="12" rx="3"/>
<text class="v" x="453.1" y="186">148 K/s</text>
<text class="l" x="20" y="212">event loop + timeranger2 append</text>
<rect class="cur" x="330" y="202" width="81.2" height="12" rx="3"/>
<text class="v" x="417.2" y="212">102 K/s</text>
<text class="l" x="20" y="238">full gobj stack, TCP</text>
<rect class="cur" x="330" y="228" width="49.9" height="12" rx="3"/>
<text class="v" x="385.9" y="238">62.9 K/s</text>
<text class="l" x="20" y="264">gobj stack, TCP + append</text>
<rect class="cur" x="330" y="254" width="38.4" height="12" rx="3"/>
<text class="v" x="374.4" y="264">48.4 K/s</text>
<text class="l" x="20" y="290">gobj stack, TLS (OpenSSL)</text>
<rect class="cur" x="330" y="280" width="36.5" height="12" rx="3"/>
<text class="v" x="372.5" y="290">45.9 K/s</text>
<text class="l" x="20" y="316">gobj stack, TLS + append</text>
<rect class="cur" x="330" y="306" width="29.4" height="12" rx="3"/>
<text class="v" x="365.4" y="316">37.1 K/s</text>
<text class="l" x="20" y="342">OAuth2 BFF logins (HTTP, 5 clients)</text>
<rect class="cur" x="330" y="332" width="10.7" height="12" rx="3"/>
<text class="v" x="346.7" y="342">13.5 K/s</text>
<text class="l" x="20" y="368">inter-yuno events (websocket round trip)</text>
<rect class="cur" x="330" y="358" width="23.0" height="12" rx="3"/>
<text class="v" x="359.0" y="368">29.0 K/s</text>
<text class="l" x="20" y="394">MQTT QoS 0 through the broker</text>
<rect class="cur" x="330" y="384" width="29.2" height="12" rx="3"/>
<text class="v" x="365.2" y="394">36.8 K/s</text>
</svg>
