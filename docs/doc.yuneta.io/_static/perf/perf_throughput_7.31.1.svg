<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" role="img" aria-label="Yuneta 7.31.1: operations per second on one core">
<title>Yuneta 7.31.1: operations per second on one core</title>
<style>
  .bg { fill: #fcfcfb; stroke: rgba(11,11,11,0.10); }
  .t { fill: #0b0b0b; font-size: 15px; font-weight: 600; }
  .l { fill: #0b0b0b; font-size: 12.5px; }
  .m { fill: #6f6d68; font-size: 11.5px; }
  .g { fill: #6f6d68; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; }
  .v { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .zero { stroke: #a3a198; stroke-width: 1; }
  .gain { fill: #2a78d6; } .price { fill: #e34948; } .noise { fill: #b9b7ae; }
  .cur { fill: #2a78d6; } .prev { fill: #9b9991; }
  .curl { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .w { stroke: #52514e; stroke-width: 1.5; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: rgba(255,255,255,0.10); }
    .t, .l { fill: #ffffff; } .m, .g { fill: #a3a198; } .v { fill: #c3c2b7; }
    .grid { stroke: #2c2c2a; } .zero { stroke: #5c5b56; }
    .gain, .cur { fill: #3987e5; } .price { fill: #e66767; } .noise { fill: #5c5b56; } .prev { fill: #7a786f; }
    .curl { stroke: #3987e5; } .w { stroke: #c3c2b7; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="899" height="439" rx="10"/>
<line class="grid" x1="330.0" x2="330.0" y1="66" y2="404"/>
<text class="m" x="330.0" y="420" text-anchor="middle">0</text>
<line class="grid" x1="369.8" x2="369.8" y1="66" y2="404"/>
<text class="m" x="369.8" y="420" text-anchor="middle">50k</text>
<line class="grid" x1="409.5" x2="409.5" y1="66" y2="404"/>
<text class="m" x="409.5" y="420" text-anchor="middle">100k</text>
<line class="grid" x1="449.3" x2="449.3" y1="66" y2="404"/>
<text class="m" x="449.3" y="420" text-anchor="middle">150k</text>
<line class="grid" x1="489.1" x2="489.1" y1="66" y2="404"/>
<text class="m" x="489.1" y="420" text-anchor="middle">200k</text>
<line class="grid" x1="528.9" x2="528.9" y1="66" y2="404"/>
<text class="m" x="528.9" y="420" text-anchor="middle">250k</text>
<line class="grid" x1="568.6" x2="568.6" y1="66" y2="404"/>
<text class="m" x="568.6" y="420" text-anchor="middle">300k</text>
<line class="grid" x1="608.4" x2="608.4" y1="66" y2="404"/>
<text class="m" x="608.4" y="420" text-anchor="middle">350k</text>
<line class="grid" x1="648.2" x2="648.2" y1="66" y2="404"/>
<text class="m" x="648.2" y="420" text-anchor="middle">400k</text>
<line class="grid" x1="687.9" x2="687.9" y1="66" y2="404"/>
<text class="m" x="687.9" y="420" text-anchor="middle">450k</text>
<line class="grid" x1="727.7" x2="727.7" y1="66" y2="404"/>
<text class="m" x="727.7" y="420" text-anchor="middle">500k</text>
<line class="grid" x1="767.5" x2="767.5" y1="66" y2="404"/>
<text class="m" x="767.5" y="420" text-anchor="middle">550k</text>
<text class="t" x="20" y="30">Yuneta 7.31.1: operations per second on one core</text>
<text class="m" x="20" y="48">as each benchmark counts them: a record stored or read, a message echoed, a round trip, a login</text>
<text class="l" x="20" y="82">timeranger2 appends (records stored)</text>
<rect class="cur" x="330" y="72" width="341.1" height="12" rx="3"/>
<text class="v" x="677.1" y="82">429 K/s</text>
<text class="l" x="20" y="108">appends with a live reader</text>
<rect class="cur" x="330" y="98" width="276.6" height="12" rx="3"/>
<text class="v" x="612.6" y="108">348 K/s</text>
<text class="l" x="20" y="134">timeranger2 reads (records loaded)</text>
<rect class="cur" x="330" y="124" width="447.6" height="12" rx="3"/>
<text class="v" x="783.6" y="134">563 K/s</text>
<text class="l" x="20" y="160">reads, page by page</text>
<rect class="cur" x="330" y="150" width="323.3" height="12" rx="3"/>
<text class="v" x="659.3" y="160">406 K/s</text>
<text class="l" x="20" y="186">io_uring event loop alone (1 KB echo)</text>
<rect class="cur" x="330" y="176" width="116.3" height="12" rx="3"/>
<text class="v" x="452.3" y="186">146 K/s</text>
<text class="l" x="20" y="212">event loop + timeranger2 append</text>
<rect class="cur" x="330" y="202" width="77.2" height="12" rx="3"/>
<text class="v" x="413.2" y="212">97.0 K/s</text>
<text class="l" x="20" y="238">full gobj stack, TCP</text>
<rect class="cur" x="330" y="228" width="50.4" height="12" rx="3"/>
<text class="v" x="386.4" y="238">63.3 K/s</text>
<text class="l" x="20" y="264">gobj stack, TCP + append</text>
<rect class="cur" x="330" y="254" width="37.8" height="12" rx="3"/>
<text class="v" x="373.8" y="264">47.5 K/s</text>
<text class="l" x="20" y="290">gobj stack, TLS (OpenSSL)</text>
<rect class="cur" x="330" y="280" width="36.6" height="12" rx="3"/>
<text class="v" x="372.6" y="290">46.0 K/s</text>
<text class="l" x="20" y="316">gobj stack, TLS + append</text>
<rect class="cur" x="330" y="306" width="28.8" height="12" rx="3"/>
<text class="v" x="364.8" y="316">36.2 K/s</text>
<text class="l" x="20" y="342">OAuth2 BFF logins (HTTP, 5 clients)</text>
<rect class="cur" x="330" y="332" width="9.3" height="12" rx="3"/>
<text class="v" x="345.3" y="342">11.7 K/s</text>
<text class="l" x="20" y="368">inter-yuno events (websocket round trip)</text>
<rect class="cur" x="330" y="358" width="21.3" height="12" rx="3"/>
<text class="v" x="357.3" y="368">26.7 K/s</text>
<text class="l" x="20" y="394">MQTT QoS 0 through the broker</text>
<rect class="cur" x="330" y="384" width="29.0" height="12" rx="3"/>
<text class="v" x="365.0" y="394">36.5 K/s</text>
</svg>
